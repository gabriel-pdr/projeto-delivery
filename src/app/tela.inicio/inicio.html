<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurante Moderno</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css" />
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=1950&q=80');
      background-size: cover;
      background-position: center;
      height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      backdrop-filter: brightness(0.6);
    }

    main.container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 4rem 2rem;
      border-radius: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    a.button {
      font-size: 1.2rem;
      padding: 1rem 2rem;
    }
  </style>
</head>

<body>
  <nav class="container-fluid">
    <ul>
      <li><strong>Restaurante Moderno</strong></li>
    </ul>
    <ul>
      <li><a href="#"></a></li>
      <li><a href="#"></a></li>
      <li><a href="#" role="button"></a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="grid">
      <section>
        <hgroup>
          <h2>Bem-vindo</h2>
          <h3>Sabor, estilo e sofisticação</h3>
        </hgroup>
        <p>
          Experimente uma nova forma de saborear o melhor da gastronomia contemporânea.
        </p>
        <a href="#" class="button">Entrar</a>
      </section>
    </div>
  </main>



  <footer class="container">
    <small><a href="#">Política de Privacidade</a> • <a href="#">Contato</a></small>
  </footer>
</body>

</html>
